name = "nodewarden"
main = "src/index.ts"
# 兼容性日期：决定 Workers 运行时的行为版本，与 wrangler/workerd 的版本绑定演进。
# 沿革：2024-01-01 → 2026-09-08（2026-09-13，随 wrangler 4.105→4.131 / workers-types 4→5）→
# 2026-10-01（2026-10-09）。⚠️ 属**运行时行为变更**：改完需本地冒烟（wrangler dev）与预览部署；
# R2 / KV 两份配置必须同改；回退只需改回日期。
compatibility_date = "2026-10-01"

workers_dev = false
preview_urls = false

# 把异常栈指回 src/ 的原始文件与行号（否则只能看到打包后的位置）。
upload_source_maps = true

# 免费层：200,000 事件/天、保留 3 天；12-01 起改按 Observability 计价（Free = 0.5 GB/天）。
# 用尽不影响 Worker：降级采样或当天停收，次日 00:00 UTC 恢复，不产生账单。
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
# 不采样：日志几乎全在错误路径（正常请求只有 1 条 invocation log），漏掉错日志代价更大。
head_sampling_rate = 1

# 一次 /api/sync 就有十几个 span，远多于日志事件 ⇒ 0.1 仍能覆盖每 5 分钟的 cron。
[observability.traces]
enabled = true
head_sampling_rate = 0.1

[observability.issues]
enabled = true

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"

#  Worker 版本的元数据（id / tag / timestamp）。每次构建部署都会换一个新的 id，
#  用来识别“版本号没变、只是重新构建并部署”的情况。
[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
