name = "nodewarden"
main = "src/index.ts"
# 兼容性日期：决定 Workers 运行时的行为版本，与 wrangler/workerd 的版本绑定演进。
# 2026-09-13 从 2024-01-01 提到 2026-09-08（当时已有最新），与同时升级的 wrangler 4.105 → 4.131、workers-types 4 → 5 配套。
# 注意：这属**运行时行为变更**，改动后必须做一次本地冒烟（wrangler dev）与预览部署；回退只需改回日期。
compatibility_date = "2026-09-08"

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"

#  Worker 版本的元数据（id / tag / timestamp）。每次构建部署都会换一个新的 id，
#  用来识别“版本号没变、只是重新构建并部署”的情况。
[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
