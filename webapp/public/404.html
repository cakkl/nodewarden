<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <meta name="robots" content="noindex" />
    <title>404 — NodeWarden</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: #f8fafc;
        color: #0f172a;
      }

      .code {
        margin: 0;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #94a3b8;
      }

      img {
        width: 60px;
        height: 48px;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 12px;
        max-width: 420px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.25;
      }

      p.hint {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: #475569;
      }

      a {
        margin-top: 4px;
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 8px 18px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        color: #ffffff;
        background: #2563eb;
      }

      a:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1520;
          color: #e2e8f0;
        }

        p.hint {
          color: #94a3b8;
        }

        a {
          background: #3b82f6;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/nodewarden-logo.svg" alt="NodeWarden" />
      <p class="code">404</p>
      <h1 data-i18n="title">Page not found</h1>
      <p class="hint" data-i18n="hint">This page may have been deleted, expired, or the link is incomplete.</p>
      <a href="/" data-i18n="home">Back to home</a>
    </main>
    <!-- 文案由 pages-spa-redirects.cjs 从语言包注入 -->
    <script type="application/json" id="nw-not-found-messages">{}</script>
    <script>
      // 静态页没有 i18n 运行时：文案来自上面的 JSON，按浏览器语言挑选；
      // 为空（未注入）时沿用 HTML 里写死的英文。
      (function () {
        var node = document.getElementById('nw-not-found-messages');
        if (!node) return;
        var messages;
        try {
          messages = JSON.parse(node.textContent || '{}');
        } catch (error) {
          return;
        }
        var locales = Object.keys(messages);
        if (!locales.length) return;

        function pick(tag) {
          var lower = String(tag || '').toLowerCase();
          if (!lower) return null;
          var exact = locales.find(function (key) { return key.toLowerCase() === lower; });
          if (exact) return exact;
          // `zh-Hans` / `zh-Hant` / `zh-HK` 都归到这两个包
          if (lower.indexOf('zh') === 0) return /tw|hk|hant|mo/.test(lower) ? 'zh-TW' : 'zh-CN';
          var base = lower.split('-')[0];
          return locales.find(function (key) { return key.toLowerCase() === base; }) || null;
        }

        var candidates = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
        var chosen = null;
        for (var i = 0; i < candidates.length && !chosen; i += 1) chosen = pick(candidates[i]);
        var table = messages[chosen || 'en'];
        if (!table) return;

        document.documentElement.lang = chosen || 'en';
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var value = table[el.getAttribute('data-i18n')];
          if (value) el.textContent = value;
        });
      })();
    </script>
  </body>
</html>
