version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Shanghai"
    # 新版本发布后先等 7 天再提 PR（cooldown）：避免上游一天连发几个补丁就刷出一串 PR，
    # 也避免刚发布、尚未被广泛验证的版本立刻进仓。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # 原先这里 ignore 了 tailwindcss 的 major 更新；2026-09-18 已完成 v3 → v4 迁移，
    # 该条已过期 ⇒ 删除，让 Dependabot 正常提 v5 的 major PR。

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:10"
      timezone: "Asia/Shanghai"
    # ⚠️ 这里原来是 0（完全关闭 Actions 的版本更新 PR）⇒ 后果是 8 个 action 长期停在旧
    # SHA，只能靠人工逐条核对（2026-09-18 一次性补了 17 处引用）。
    # 本仓用 commit SHA 固定 action（tag 可被移动，固定 SHA 是安全实践），
    # 代价就是不会自动更新 ⇒ 必须打开这个开关才能跟上上游。
    # 各 workflow 的 `uses:` 行尾都带 `# vX.Y.Z` 注释，便于比对 SHA 落在哪个版本。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
