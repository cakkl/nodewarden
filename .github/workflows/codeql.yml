name: "CodeQL Advanced"

on:
  # 只在本仓 main 上响应 push；指向 PR 的分支改动由 pull_request 事件覆盖。
  # 原先监听 "**" 会让每次推分支都跑满一轮（PR 上因而跑 3 次：推分支、PR、合并后）。
  push:
    branches: [main]
  pull_request:

# 权限一律在 job 级声明：工作流级声明会让所有 job（含未来的新 job）共享同一套权限，
# 而 security-events: write 只有上传分析结果的那一步需要。
permissions: {}

jobs:
  analyze:
    name: CodeQL Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@411bbbe57033eedfc1a82d68c01345aa96c737d7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@411bbbe57033eedfc1a82d68c01345aa96c737d7
        with:
          category: "/language:${{ matrix.language }}"
