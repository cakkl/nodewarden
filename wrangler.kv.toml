name = "nodewarden"
main = "src/index.ts"
# 同 wrangler.toml：两份配置（R2 / KV 两种部署形态）必须同步改，否则会出现
# "本地能跑、KV 形态部署跑不了" 一类只在一侧暴露的问题。
compatibility_date = "2026-09-08"

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[kv_namespaces]]
binding = "ATTACHMENTS_KV"

#  Worker 版本的元数据（id / tag / timestamp）。这份配置是 KV 部署变体，
#  与 wrangler.toml 保持一致，否则 deploy:kv 出来的 Worker 会缺这个绑定。
[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
